- name: Install PostgreSQL 16 packages
  package:
    name:
      - postgresql-16
      - postgresql-client-16
    state: present

- name: Ensure PostgreSQL service is enabled and started
  service:
    name: postgresql-16
    state: started
    enabled: true

- name: Set replication settings in postgresql.conf
  lineinfile:
    path: /var/lib/pgsql/16/data/postgresql.conf
    regexp: "^{{ item.key }}\\s*="
    line: "{{ item.key }} = '{{ item.value }}'"
  loop:
    - { key: "listen_addresses", value: "*" }
    - { key: "wal_level", value: "replica" }
    - { key: "max_wal_senders", value: "10" }
    - { key: "max_replication_slots", value: "10" }
    - { key: "wal_keep_size", value: "1GB" }
  notify: restart postgresql primary

- name: Allow replica host in pg_hba.conf
  lineinfile:
    path: /var/lib/pgsql/16/data/pg_hba.conf
    line: "host replication {{ postgres_replication_user }} {{ postgres_replica_ip }}/32 scram-sha-256"
    insertafter: EOF
  notify: restart postgresql primary

- name: Create replication user
  become_user: postgres
  shell: |
    psql -tc "SELECT 1 FROM pg_roles WHERE rolname='{{ postgres_replication_user }}'" | grep -q 1 || \
    psql -c "CREATE ROLE {{ postgres_replication_user }} WITH REPLICATION LOGIN PASSWORD '{{ postgres_replication_password }}';"